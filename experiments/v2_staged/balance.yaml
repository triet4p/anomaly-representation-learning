# Sprint 11 Task 22 — 5-epoch coefficient-balance stage.
#
# Predeclared coefficient matrix for the normal-density,
# variance/covariance, background-consistency, and boundary terms.
# Cell balance-b equals the default hybrid. Test labels stay sealed:
# selection uses training plus verified-healthy validation diagnostics
# only (Task 29 owns the frozen selection and its rationale).
stage: balance
epochs: 5
seed: 0
d_model: 32
batch_size: 8
lr: 0.001
corruption_rate: 0.1
severity: 2.0
# Stage-specific boundary schedule (predeclared Task 28 fix): the Task 22
# default warmup (500 steps) exceeds the ~30-step five-epoch budget, which
# left alpha at 0 for the whole contract stage (Task 27). Warmup 5 + ramp 10
# reaches alpha_max at step 15, keeping the boundary term active and
# observable for 24 of ~30 steps without consulting any test outcome.
boundary_warmup_steps: 5
boundary_ramp_steps: 10
# Resolved to the exact git HEAD at runtime (see v2_staged.resolve_commit).
commit: "{COMMIT}"
cells:
  - cell: balance-a
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 0.5
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-b
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-c
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 0.5
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-control
    variant: control-normal-only
    coefficients:
      boundary_alpha_max: 0.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
