# Sprint 11 Task 22 — 5-epoch coefficient-balance stage.
#
# Predeclared coefficient matrix for the COMPLETE corrected objective:
# clean conditional-density NLL (weight 1.0 by methodology, never ablated)
# plus variance/covariance, background-consistency, and ramped boundary
# terms. Cell balance-b equals the a priori default hybrid. Stationary
# selection minimizes the complete signed-likelihood validation objective
# at the final boundary coefficient; aggregation consumes the
# boundary-trained context energy with explicit energy_source identity;
# the operating threshold is dev-val-calibrated and drives commissioning;
# the conformal fit is dev-val-only with distinct provenances. Test labels
# stay sealed: selection uses training plus verified-healthy validation
# diagnostics only (Task 29 owns the frozen selection and its rationale).
#
# Prior Task 29 winner/full-freeze records (balance-b under the superseded
# incomplete objective) are SUPERSEDED and must not be reused: this matrix
# is predeclared and outcome-independent, and the frozen full hybrid
# reverts to the predeclared default until Task 29 re-selects on corrected
# validation-only diagnostics from a rerun of this matrix.
#
# Small-sample rule (Deep-Review Finding 3): same explicit structural
# minimum as the contract stage (see contract.yaml). The locked server dev
# cohort carries 11 verified-healthy dev-val files: the fit stays
# dev-val-only, provenance flags small_sample=true, and coverage is an
# in-sample diagnostic. No pooled dev-train fallback.
stage: balance
epochs: 5
seed: 0
d_model: 32
batch_size: 8
lr: 0.001
corruption_rate: 0.1
severity: 2.0
# Stage-specific boundary schedule (predeclared Task 28 fix): the Task 22
# default warmup (500 steps) exceeds the ~30-step five-epoch budget, which
# left alpha at 0 for the whole contract stage (Task 27). Warmup 5 + ramp 10
# reaches alpha_max at step 15, keeping the boundary term active and
# observable for 24 of ~30 steps without consulting any test outcome.
boundary_warmup_steps: 5
boundary_ramp_steps: 10
# Explicit small-sample floor for the dev-val-only conformal fit (see above).
calibration_min_samples: 4
# Resolved to the exact git HEAD at runtime (see v2_staged.resolve_commit).
commit: "{COMMIT}"
cells:
  - cell: balance-a
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 0.5
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-b
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-c
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 0.5
      variance_weight: 1.0
      covariance_weight: 1.0
  - cell: balance-control
    variant: control-normal-only
    coefficients:
      boundary_alpha_max: 0.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
