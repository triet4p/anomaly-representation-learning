# Sprint 11 Task 22 — 50-epoch full stage: hybrid boundary model.
#
# PREDECLARED (not frozen-selected) V2 hybrid configuration for the Task 31
# full training rerun, matched to full_control.yaml on commit, data, seed
# policy, compute profile, and output contract. Coefficients equal the a
# priori DEFAULT hybrid (hybrid_coefficients()); any resemblance to the
# superseded Task 29 winner is coincidental, not selective —
# the prior selection was made under the superseded incomplete objective
# and is SUPERSEDED along with its full-run config/result records. The
# frozen selection will be re-made by the Task 29 rerun on corrected
# validation-only diagnostics; until then no coefficient set here is
# claimed frozen or selected. Complete corrected objective,
# likelihood-consistent stationary selection, explicit context-energy
# identity, dev-val-calibrated operating threshold, dev-val-only
# conformal fit, and distinct provenances throughout (see contract.yaml).
#
# Small-sample rule (Deep-Review Finding 3): same explicit structural
# minimum as the contract stage (see contract.yaml). The locked server dev
# cohort carries 11 verified-healthy dev-val files: the fit stays
# dev-val-only, provenance flags small_sample=true, and coverage is an
# in-sample diagnostic. No pooled dev-train fallback.
stage: full
epochs: 50
seed: 0
d_model: 32
batch_size: 8
lr: 0.001
corruption_rate: 0.1
severity: 2.0
# Explicit predeclared full-stage boundary schedule (Task 29 freeze): the
# inherited default warmup (500 steps) would exceed the ~300-step 50-epoch
# budget (Task 27 measured 12 steps over 2 epochs at batch 8), leaving alpha
# at 0 for the whole full run. Warmup 50 + ramp 100 reaches alpha_max at
# step 150 and is nonzero for 249 of ~300 steps — the same a priori
# step-budget scaling as the balance fix — without consulting any outcome.
boundary_warmup_steps: 50
boundary_ramp_steps: 100
# Explicit small-sample floor for the dev-val-only conformal fit (see above).
calibration_min_samples: 4
# Resolved to the exact git HEAD at runtime (see v2_staged.resolve_commit).
commit: "{COMMIT}"
cells:
  - cell: default
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
