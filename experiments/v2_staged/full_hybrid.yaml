# Sprint 11 Task 22 — 50-epoch frozen full stage: hybrid boundary model.
#
# Frozen V2 hybrid configuration for the Task 31 full training run,
# matched to full_control.yaml on commit, data, seed policy, compute
# profile, and output contract. Coefficients equal the balance-b cell;
# Task 29 may reselect on validation-only diagnostics before the full
# run, recording rejected cells and rationale there.
stage: full
epochs: 50
seed: 0
d_model: 32
batch_size: 8
lr: 0.001
corruption_rate: 0.1
severity: 2.0
# Resolved to the exact git HEAD at runtime (see v2_staged.resolve_commit).
commit: "{COMMIT}"
cells:
  - cell: default
    variant: hybrid-boundary
    coefficients:
      boundary_alpha_max: 1.0
      boundary_margin: 1.0
      background_weight: 1.0
      variance_weight: 1.0
      covariance_weight: 1.0
